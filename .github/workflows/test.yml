name: Test

on:
  push:
    paths:
      - "src/**/*.ts"
      - "tests/**/*.ts"
      - "package.json"
  workflow_dispatch:

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          run-install: true

      - name: Run test
        run: |
          echo "# Test Output" >> $GITHUB_STEP_SUMMARY
          pnpm test &>> $GITHUB_STEP_SUMMARY
